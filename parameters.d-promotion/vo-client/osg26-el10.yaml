###################
# OSG 26 tests for EL10
# File format documention:
# https://github.com/opensciencegrid/vm-test-runs#running-osg-test-in-vm-universe
###################

platforms:
  - rocky_10.x86_64
  - alma_10.x86_64
  - centos_stream_10.x86_64
  # - rocky_10.aarch64
  - alma_10.aarch64
  - centos_stream_10.aarch64

sources:
  - opensciencegrid:master; 25; osg, osg-upcoming > 26/osg-minefield
  - opensciencegrid:master; 26; osg-minefield
  - opensciencegrid:master; 26; osg > osg-minefield

package_sets:
  - label: Compute Entrypoint (Condor) (EL10)
    packages:
      - osg-ce-condor
  - label: Worker Node (privileged)
    packages:
      - osg-wn-client
      - osg-oasis
      - apptainer-suid
  - label: XRootD
    packages:
      - osg-xrootd-standalone
      - xrootd-multiuser
      - xrootd-client
      - voms-clients-cpp
