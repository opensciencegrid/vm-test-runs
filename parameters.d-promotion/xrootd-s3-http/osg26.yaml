platforms:
  - rocky_8.x86_64
  - alma_8.x86_64
  - rocky_9.x86_64
  - alma_9.x86_64
  - centos_stream_9.x86_64
  # - rocky_9.aarch64
  - alma_9.aarch64
  - centos_stream_9.aarch64
  - rocky_10.x86_64
  - alma_10.x86_64
  - centos_stream_10.x86_64
  # - rocky_10.aarch64
  - alma_10.aarch64
  - centos_stream_10.aarch64

sources:
  - opensciencegrid:master; 25; osg, osg-upcoming > 26/osg-minefield
  - opensciencegrid:master; 26; osg-minefield
  - opensciencegrid:master; 26; osg > osg-minefield

package_sets:
  - label: XRootD + XRootD-S3-HTTP
    packages:
      - osg-xrootd-standalone
      - xrootd-multiuser
      - xrootd-client
      - voms-clients-cpp
      - xrootd-s3-http
  - label: OSDF Cache and Origin + XRootD-S3-HTTP
    packages:
      - osdf-cache
      - osdf-origin
      - xrootd-s3-http
